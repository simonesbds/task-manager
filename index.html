<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk — Task Manager</title>
    <meta
      name="description"
      content="Desk, a task manager with priorities, filters, search, keyboard shortcuts and dark mode. Built with vanilla JavaScript."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <div class="shell">
      <!-- ================= SIDEBAR ================= -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" /></svg>
          </span>
          <span class="brand-name">Desk</span>
        </div>

        <nav class="views" aria-label="Filter tasks">
          <p class="nav-label">Views</p>

          <button class="filter-btn active" type="button" data-filter="all">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <path d="M3 10h18" />
            </svg>
            <span>All tasks</span>
            <span class="nav-count" id="count-all">0</span>
          </button>

          <button class="filter-btn" type="button" data-filter="active">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8" />
            </svg>
            <span>Active</span>
            <span class="nav-count" id="count-active">0</span>
          </button>

          <button class="filter-btn" type="button" data-filter="completed">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8" />
              <path d="m8.5 12.5 2.5 2.5 4.5-5" />
            </svg>
            <span>Completed</span>
            <span class="nav-count" id="count-completed">0</span>
          </button>
        </nav>

        <!-- Progress -->
        <div class="progress-card">
          <div class="d-flex justify-content-between align-items-baseline mb-2">
            <span class="nav-label m-0">Progress</span>
            <span class="progress-percent" id="progress-percent">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="progress-label" id="progress-label">No tasks yet</p>
        </div>

        <div class="sidebar-footer">
          <button id="theme-toggle" class="sidebar-btn" type="button">
            <!-- CSS shows the moon in light mode and the sun in dark mode -->
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <span class="label-light">Dark mode</span>
            <span class="label-dark">Light mode</span>
          </button>

          <p class="shortcuts">
            <kbd>N</kbd> new task <span class="dot">·</span> <kbd>/</kbd> search
          </p>
        </div>
      </aside>

      <!-- ================= MAIN ================= -->
      <main class="main">
        <header class="topbar">
          <div>
            <p class="today" id="today"></p>
            <h1 class="view-title">
              <span id="view-title">All tasks</span>
              <span id="task-counter" class="view-count"></span>
            </h1>
          </div>

          <div class="search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <label class="visually-hidden" for="search-input">Search tasks</label>
            <input
              type="search"
              id="search-input"
              placeholder="Search tasks"
              autocomplete="off"
            />
            <kbd>/</kbd>
          </div>
        </header>

        <!-- New task -->
        <form id="task-form" class="composer">
          <span class="composer-plus" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </span>

          <label class="visually-hidden" for="task-input">New task</label>
          <input
            type="text"
            id="task-input"
            class="composer-input"
            placeholder="Add a task…"
            autocomplete="off"
            required
          />

          <label class="visually-hidden" for="priority-input">Priority</label>
          <select id="priority-input" class="composer-select">
            <option value="low">Low priority</option>
            <option value="medium">Medium priority</option>
            <option value="high">High priority</option>
          </select>

          <button class="btn-primary-task" type="submit">
            Add task <kbd class="kbd-on-accent">↵</kbd>
          </button>
        </form>

        <!-- List (filled by app.js, grouped by priority) -->
        <ul id="task-list" class="task-list"></ul>
      </main>
    </div>

    <!-- EDIT -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title" id="editTitle">Edit task</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <label class="visually-hidden" for="edit-input">Task text</label>
            <input type="text" id="edit-input" class="field" />
          </div>
          <div class="modal-footer">
            <button class="btn-ghost-task" type="button" data-bs-dismiss="modal">Cancel</button>
            <button id="save-edit-btn" class="btn-primary-task" type="button">Save changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- DELETE -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title" id="deleteTitle">Delete task?</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body muted">This action can't be undone.</div>
          <div class="modal-footer">
            <button class="btn-ghost-task" type="button" data-bs-dismiss="modal">Cancel</button>
            <button id="confirm-delete-btn" class="btn-danger-task" type="button">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
